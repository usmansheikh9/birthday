<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real values -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFE8D6" />
<meta name="color-scheme" content="light" />
<title>Happy Birthday</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,600;1,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================================================
     BACKGROUND DECOR (fixed, behind everything, pointer-events:none)
     ============================================================ -->
<div class="decor" aria-hidden="true">
  <span class="balloon balloon--1"></span>
  <span class="balloon balloon--2"></span>
  <span class="balloon balloon--3"></span>
  <span class="balloon balloon--4"></span>
  <span class="sparkle sparkle--1"></span>
  <span class="sparkle sparkle--2"></span>
  <span class="sparkle sparkle--3"></span>
  <span class="sparkle sparkle--4"></span>
  <span class="sparkle sparkle--5"></span>
  <span class="sparkle sparkle--6"></span>
</div>

<!-- Confetti draws here. Fixed + pointer-events:none so it never blocks taps. -->
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<!-- ============================================================
     ZERO-STATE TAP GATE
     Web Audio needs a real user gesture before it will make sound, and a
     cold load straight into the zero-state (opening the link any time
     after TARGET_MS) has had none yet. This stands in for that gesture -
     shown instead of the countdown, never alongside it - before the
     confetti/blow-out sequence proceeds. See boot in script.js.
     ============================================================ -->
<div class="zero-gate" id="zero-gate" hidden>
  <button class="btn btn--primary zero-gate__btn" id="zero-gate-btn" type="button">
    Tap to begin &#127881;
  </button>
</div>

<!-- ============================================================
     #app - the screen manager root.
     Every direct child .screen is a full page. showScreen(name)
     in script.js toggles .is-active by data-screen value.
     ============================================================ -->
<main id="app">

  <!-- ==========================================================
       SCREEN 1 - CAKE + COUNTDOWN
       ========================================================== -->
  <section class="screen screen--cake is-active" data-screen="cake">

    <header class="intro">
      <p class="intro__kicker">&#127874; almost time &#127874;</p>
      <!-- [HER NAME] - the name text comes from HER_NAME in script.js -->
      <h1 class="intro__title" id="countdown-label">
        <span id="her-name">Alishba</span> turns <span id="her-age">22</span> in
      </h1>
    </header>

    <!-- ---------- THE CAKE (pure CSS, zero images) ---------- -->
    <div class="cake-stage">
      <div class="cake" id="cake">

        <!-- Number candles spelling "22".
             Each .flame is its own element sharing class "flame" so a later
             feature (mic blow-out) can extinguish them one at a time.
             See extinguishFlame(i) / relightFlames() in script.js. -->
        <div class="candles">
          <div class="candle" data-candle="0">
            <span class="flame" data-flame="0">
              <span class="flame__glow"></span>
              <span class="flame__core"></span>
            </span>
            <span class="wick"></span>
            <span class="candle__digit">2</span>
          </div>
          <div class="candle" data-candle="1">
            <span class="flame" data-flame="1">
              <span class="flame__glow"></span>
              <span class="flame__core"></span>
            </span>
            <span class="wick"></span>
            <span class="candle__digit">2</span>
          </div>
        </div>

        <!-- TOP TIER -->
        <div class="tier tier--top">
          <div class="tier__frosting">
            <span class="sprinkle" style="--x:18%;--y:38%;--r:24deg;--c:var(--pink)"></span>
            <span class="sprinkle" style="--x:44%;--y:62%;--r:-38deg;--c:var(--mint)"></span>
            <span class="sprinkle" style="--x:70%;--y:34%;--r:66deg;--c:var(--sun)"></span>
            <span class="sprinkle" style="--x:86%;--y:66%;--r:-12deg;--c:var(--pink)"></span>
          </div>
          <div class="tier__body"></div>
        </div>

        <!-- MIDDLE TIER -->
        <div class="tier tier--mid">
          <div class="tier__frosting">
            <span class="sprinkle" style="--x:12%;--y:40%;--r:-28deg;--c:var(--mint)"></span>
            <span class="sprinkle" style="--x:34%;--y:66%;--r:48deg;--c:var(--sun)"></span>
            <span class="sprinkle" style="--x:56%;--y:32%;--r:-56deg;--c:var(--pink)"></span>
            <span class="sprinkle" style="--x:76%;--y:60%;--r:18deg;--c:var(--lilac)"></span>
            <span class="sprinkle" style="--x:90%;--y:36%;--r:-72deg;--c:var(--mint)"></span>
          </div>
          <div class="tier__body">
            <span class="dot" style="--x:22%;--y:52%"></span>
            <span class="dot" style="--x:50%;--y:52%"></span>
            <span class="dot" style="--x:78%;--y:52%"></span>
          </div>
        </div>

        <!-- BOTTOM TIER -->
        <div class="tier tier--bottom">
          <div class="tier__frosting">
            <span class="sprinkle" style="--x:10%;--y:36%;--r:34deg;--c:var(--sun)"></span>
            <span class="sprinkle" style="--x:28%;--y:64%;--r:-20deg;--c:var(--pink)"></span>
            <span class="sprinkle" style="--x:48%;--y:34%;--r:62deg;--c:var(--mint)"></span>
            <span class="sprinkle" style="--x:66%;--y:66%;--r:-44deg;--c:var(--lilac)"></span>
            <span class="sprinkle" style="--x:84%;--y:38%;--r:14deg;--c:var(--sun)"></span>
            <span class="sprinkle" style="--x:94%;--y:64%;--r:-64deg;--c:var(--pink)"></span>
          </div>
          <div class="tier__body">
            <span class="dot" style="--x:16%;--y:56%"></span>
            <span class="dot" style="--x:38%;--y:56%"></span>
            <span class="dot" style="--x:62%;--y:56%"></span>
            <span class="dot" style="--x:84%;--y:56%"></span>
          </div>
        </div>

        <!-- PLATE -->
        <div class="plate"></div>
      </div>
    </div>

    <!-- ---------- COUNTDOWN PILLS ---------- -->
    <div class="countdown" id="countdown" role="timer">
      <div class="pill">
        <span class="pill__num" id="cd-days">00</span>
        <span class="pill__label">days</span>
      </div>
      <div class="pill">
        <span class="pill__num" id="cd-hours">00</span>
        <span class="pill__label">hrs</span>
      </div>
      <div class="pill">
        <span class="pill__num" id="cd-mins">00</span>
        <span class="pill__label">min</span>
      </div>
      <div class="pill pill--secs">
        <span class="pill__num" id="cd-secs">00</span>
        <span class="pill__label">sec</span>
      </div>
    </div>

    <!-- ==========================================================
         BLOW-OUT PANEL
         Hidden until the countdown hits zero. reachBirthday() ->
         onBirthdayReached() -> blowout.begin() reveals it.
         ?skip reaches the same path, so this shows up immediately.
         ========================================================== -->
    <div class="blow" id="blow" hidden>

      <p class="blow__title" id="blow-title">Make a wish and blow out your candles</p>

      <!-- animated mic + wind hint (pure CSS) -->
      <div class="blow__hint" id="blow-hint" aria-hidden="true">
        <span class="mic"><span class="mic__stand"></span></span>
        <span class="wind"><i></i><i></i><i></i></span>
      </div>

      <!-- live blow meter: fills as she blows -->
      <div class="blow__meter" id="blow-meter" hidden>
        <span class="blow__meter-fill" id="blow-fill"></span>
      </div>

      <p class="blow__note" id="blow-note">Tap to allow your mic so you can blow out the candles.</p>

      <button class="btn btn--primary" id="btn-mic" type="button">Allow mic &#127908;</button>

      <!-- The guaranteed path. Visible from the moment the panel appears,
           never gated behind the mic. The candles are tappable too. -->
      <button class="btn btn--ghost" id="btn-tap" type="button" hidden>
        &#128367; Tap here to blow out the candles
      </button>
    </div>

    <p class="footnote">made with &#128155;</p>
  </section>

  <!-- NOTE: there is no separate "blow" screen any more. The blow-out
       happens in place on the cake screen above, because that is where the
       .flame elements live. goToCollage() is what runs once both are out. -->

  <!-- ==========================================================
       SCREEN 3 - PHOTO / VIDEO COLLAGE   (TODO)
       Wire up: a scrollable grid of img/video from a /media folder,
       tap to open a lightbox. Keep images lazy-loaded.
       ========================================================== -->
  <section class="screen screen--collage" data-screen="collage">
    <div class="collage" id="collage">

      <p class="collage__caption">us, so far &#128149;</p>

      <!-- Polaroid card. The slides themselves are built by script.js from
           the PHOTOS array, so adding 10.jpg means editing that array only. -->
      <div class="pola" id="pola">
        <div class="pola__well">
          <div class="pola__slides" id="pola-slides"></div>
          <!-- vintage treatment, stacked above the photo -->
          <div class="pola__grain" aria-hidden="true"></div>
          <div class="pola__vignette" aria-hidden="true"></div>
        </div>
        <div class="pola__mat">
          <span class="pola__count" id="pola-count">1 / 9</span>
        </div>
      </div>

      <!-- 9 dots; the active one is a pill that fills over the hold -->
      <div class="dots" id="collage-dots" aria-label="Photo progress"></div>

      <button class="btn btn--ghost collage__skip" id="collage-skip" type="button">
        skip to the letter &rarr;
      </button>
    </div>
  </section>

  <!-- ==========================================================
       SCREEN 4 - THE LETTER
       Letter body is loaded from /assets/letter.txt at runtime (see
       LETTER.load() in script.js) and split into paragraphs on blank
       lines. Each paragraph fades/rises in on its own, either in a
       gentle stagger on arrival or as she scrolls down to it — she is
       never rushed.
       ========================================================== -->
  <section class="screen screen--letter" data-screen="letter">
    <div class="letter" id="letter">

      <!-- soft ambient hearts, purely decorative -->
      <div class="letter__ambient" aria-hidden="true">
        <span class="letter__mote letter__mote--1">&#10084;</span>
        <span class="letter__mote letter__mote--2">&#10022;</span>
        <span class="letter__mote letter__mote--3">&#10084;</span>
        <span class="letter__mote letter__mote--4">&#10022;</span>
      </div>

      <p class="letter__kicker">&#128140; a letter, just for you</p>

      <article class="letter__paper" id="letter-paper">
        <div class="letter__body" id="letter-body">
          <!-- paragraphs injected here by LETTER.load() -->
        </div>
      </article>
    </div>
  </section>

  <!-- ==========================================================
       SCREEN 5 - THE GAME
       A short, scripted, auto-playing top-down "how we met" cutscene.
       No free-roam, no physics — GAME.play() in script.js walks the
       sprites along preset waypoints and steps through fixed beats.
       Tapping the stage skips ahead through the narrative beats; the
       dialogue choice, the whodunit puzzle, and the chest all take a
       deliberate tap on their own target instead.

       Flow: reachBirthday() (real countdown or ?skip) fires confetti and
       calls blowout.begin() directly, same as before this scene existed.
       Once the candles are out, blowout's own finish() calls goToGame()
       — so this scene runs right after the blow-out. Tapping the chest
       at the end of the game is what calls goToCollage(), which leads
       on to the letter exactly as before.
       ========================================================== -->
  <section class="screen screen--game" data-screen="game">
    <div class="game" id="game">

      <!-- The canteen, built entirely from flat shapes — no image assets. -->
      <div class="stage" id="game-stage">
        <div class="stage__outdoor" aria-hidden="true"></div>

        <!-- "RC Canteen" signpost, so the location reads at a glance -->
        <div class="signpost" style="--x:10%; --y:86%;" aria-hidden="true">
          <span class="signpost__board">RC Canteen</span>
          <span class="signpost__post"></span>
        </div>

        <div class="counter" aria-hidden="true">
          <span class="counter__tray"></span>
          <span class="counter__tray"></span>
          <span class="counter__tray"></span>
        </div>

        <!-- tables: chairs first so the tabletop layers on top -->
        <div class="table" id="table-her" style="--x:72%; --y:46%;">
          <span class="chair chair--n"></span>
          <span class="chair chair--s"></span>
          <span class="chair chair--e"></span>
          <span class="chair chair--w"></span>
          <span class="table__top"></span>
        </div>
        <div class="table" style="--x:28%; --y:54%;">
          <span class="chair chair--n"></span>
          <span class="chair chair--s"></span>
          <span class="chair chair--e"></span>
          <span class="chair chair--w"></span>
          <span class="table__top"></span>
        </div>
        <div class="table table--outdoor" style="--x:87%; --y:78%;">
          <span class="chair chair--n"></span>
          <span class="chair chair--s"></span>
          <span class="table__top"></span>
        </div>

        <span class="tree" style="--x:92%; --y:18%;" aria-hidden="true"></span>
        <span class="tree" style="--x:92%; --y:58%;" aria-hidden="true"></span>

        <span class="mat" style="--x:15%; --y:97%;" aria-hidden="true"></span>

        <!-- background life: static, non-interactive -->
        <div class="npc" style="--x:30%; --y:40%; --c:var(--earth-npc-1);" aria-hidden="true"></div>
        <div class="npc" style="--x:24%; --y:66%;  --c:var(--earth-npc-2);" aria-hidden="true"></div>
        <div class="npc" style="--x:44%; --y:12%; --c:var(--earth-npc-3);" aria-hidden="true"></div>

        <!-- the treasure chest, present from the start but only tappable
             once the puzzle is solved (see .chest.is-active) -->
        <div class="chest" id="game-chest" style="--x:90%; --y:92%;">
          <span class="chest__lid"></span>
          <span class="chest__latch"></span>
        </div>

        <!-- own stacking layer, positioned above the chest — a sprite
             walking past must never be able to cover this -->
        <span class="chest__hint" id="chest-hint" style="--x:78%; --y:76%;" hidden>Tap the chest &#10024;</span>

        <!-- "her" — already seated at her table from the start -->
        <div class="sprite sprite--her" id="sprite-her" style="--x:72%; --y:40%;">
          <div class="sprite__inner">
            <span class="limb arm arm--l"></span>
            <span class="limb arm arm--r"></span>
            <div class="sprite__body"></div>
            <div class="sprite__face"><span class="eye eye--l"></span><span class="eye eye--r"></span></div>
            <span class="limb leg leg--l"></span>
            <span class="limb leg leg--r"></span>
          </div>
        </div>

        <!-- "me" -->
        <div class="sprite sprite--me" id="sprite-me" style="--x:15%; --y:97%;">
          <span class="sprite__mark" id="me-mark" hidden>!</span>
          <div class="sprite__inner">
            <span class="limb arm arm--l"></span>
            <span class="limb arm arm--r"></span>
            <div class="sprite__body"></div>
            <div class="sprite__face"><span class="eye eye--l"></span><span class="eye eye--r"></span></div>
            <span class="limb leg leg--l"></span>
            <span class="limb leg leg--r"></span>
          </div>
        </div>
      </div>

      <p class="footnote game__hint" id="game-hint">tap to skip ahead</p>

      <!-- dialogue box: a plain line, or a line with a pair of choices —
           GAME.js toggles which is shown per beat -->
      <div class="dialogue" id="game-dialogue" hidden>
        <p class="dialogue__text" id="game-dialogue-text"></p>
        <div class="dialogue__choices" id="game-dialogue-choices" hidden>
          <button class="btn btn--primary dialogue__choice" type="button">Yes</button>
          <button class="btn btn--primary dialogue__choice" type="button">Yes</button>
        </div>
        <span class="dialogue__hint" id="game-dialogue-hint">tap to continue</span>
      </div>

      <!-- the "what was I thinking about" puzzle: 3 tappable options,
           infinite retries — see GAME.runPuzzle() -->
      <div class="puzzle" id="game-puzzle" hidden>
        <p class="puzzle__question" id="puzzle-question"></p>
        <div class="puzzle__suspects" id="puzzle-suspects">
          <button class="suspect" type="button" data-suspect="0">
            <span class="suspect__avatar"><span class="suspect__glyph">&#128173;</span></span>
            <span class="suspect__name"></span>
          </button>
          <button class="suspect" type="button" data-suspect="1">
            <span class="suspect__avatar"><span class="suspect__glyph">&#128173;</span></span>
            <span class="suspect__name"></span>
          </button>
          <button class="suspect" type="button" data-suspect="2">
            <span class="suspect__avatar"><span class="suspect__glyph">&#128173;</span></span>
            <span class="suspect__name"></span>
          </button>
        </div>
        <p class="puzzle__feedback" id="puzzle-feedback">&nbsp;</p>
      </div>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
